# vsftpd最小化配置文件
# 监听设置
listen=YES
listen_port=21
listen_address=0.0.0.0

# 用户认证设置
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# 连接设置
dirmessage_enable=YES
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/data/logs/vsftpd.log
ftpd_banner=Welcome to FTP service.

# 安全设置
chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO

# 主动模式设置
connect_from_port_20=YES
port_enable=YES

# 被动模式设置（将通过环境变量动态修改）
pasv_enable=YES
pasv_min_port=10000
pasv_max_port=10010

# 用户和目录设置
local_root=/data/www

# 性能设置
idle_session_timeout=600
data_connection_timeout=120
max_clients=50
max_per_ip=5

# 日志设置
log_ftp_protocol=YES
syslog_enable=NO
background=YES