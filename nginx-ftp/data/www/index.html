<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文件服务</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
        max-width: 600px;
        width: 100%;
        text-align: center;
      }
      h1 {
        color: #667eea;
        margin-bottom: 20px;
      }
      .info {
        text-align: left;
        margin: 20px 0;
      }
      .info-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .info-label {
        font-weight: 600;
        color: #495057;
      }
      .info-value {
        color: #6c757d;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        margin-top: 20px;
        transition: all 0.3s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📁 Nginx FTP 文件服务</h1>

      <div class="info">
        <div class="info-item">
          <span class="info-label">🌐 Web服务:</span>
          <span class="info-value">localhost:80</span>
        </div>
        <div class="info-item">
          <span class="info-label">📤 FTP服务:</span>
          <span class="info-value">localhost:21</span>
        </div>
        <div class="info-item">
          <span class="info-label">🔐 SSH服务:</span>
          <span class="info-value">localhost:222</span>
        </div>
        <div class="info-item">
          <span class="info-label">👤 用户名:</span>
          <span class="info-value">admin</span>
        </div>
      </div>

      <div
        style="
          margin-top: 30px;
          padding: 20px;
          background: #f8f9fa;
          border-radius: 8px;
          text-align: left;
        "
      >
        <h3 style="color: #495057; margin-top: 0">📋 服务说明</h3>
        <ul style="color: #6c757d; line-height: 1.6">
          <li><strong>Web访问</strong>: 浏览目录列表和下载文件</li>
          <li><strong>FTP上传</strong>: 使用FTP客户端上传文件到当前目录</li>
          <li><strong>SSH管理</strong>: 通过SSH进行文件管理</li>
        </ul>
      </div>
    </div>
  </body>
</html>
